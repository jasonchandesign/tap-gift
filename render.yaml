services:
  - type: web
    name: tap-gift
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tap-gift-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: tap-gift-db
    plan: 0.1c-256mb
    databaseName: tap_gift
